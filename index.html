<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Link privado: evita que los buscadores indexen la página -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Countdown navideño</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Decoraciones del fondo: copos, destellos, colinas con pinos (js/decorations.js, config en js/config.js) -->
  <div class="decor decor--back" id="decor-back" aria-hidden="true"></div>

  <!-- Renos volando de vez en cuando (js/reindeer.js) -->
  <div class="reindeer-layer" id="reindeer" aria-hidden="true"></div>

  <!-- Luces navideñas: borde superior y parte alta de los costados (js/lights.js) -->
  <div class="lights" id="lights" aria-hidden="true"></div>

  <!-- Bolas navideñas colgantes -->
  <div class="decor decor--front" id="decor-front" aria-hidden="true"></div>

  <!-- Selector de Santa (arriba a la derecha) -->
  <div class="santa-picker" id="santa-picker">
    <button class="picker-btn" id="picker-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="picker-panel" aria-label="Elegir Santa">
      <span class="picker-face" id="picker-face"></span>
    </button>
    <div class="picker-panel" id="picker-panel" hidden>
      <p class="picker-title">Elige tu Santa</p>
      <div class="picker-grid" id="picker-grid"></div>
    </div>
  </div>

  <!-- Nieve animada -->
  <canvas id="snow" aria-hidden="true"></canvas>

  <!-- ===== Contenido ===== -->
  <main class="content">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow"><span class="dot dot--white"></span>Countdown navideño<span class="dot dot--green"></span></p>
      <h1 id="title" class="title">Falta poco para <em>Navidad</em></h1>

      <div class="countdown" id="countdown" role="timer" aria-live="off">
        <div class="unit"><span class="num" data-unit="days">--</span><span class="label">días</span></div>
        <div class="unit"><span class="num" data-unit="hours">--</span><span class="label">horas</span></div>
        <div class="unit"><span class="num" data-unit="minutes">--</span><span class="label">minutos</span></div>
        <div class="unit"><span class="num" data-unit="seconds">--</span><span class="label">segundos</span></div>
      </div>

      <p class="merry" id="merry" hidden>🎄 ¡Feliz Navidad! 🎄</p>
    </section>

    <!-- Santa gordito: al tocarlo se infla y estalla en confeti (js/santa.js); el tema se elige arriba a la derecha -->
    <div class="santa-stage">
      <button class="big-santa" id="big-santa" type="button" aria-haspopup="dialog" aria-label="Tocar a Santa para ver la actividad de hoy">
        <!-- El Santa elegido se dibuja aquí desde js/santas.js -->
      </button>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <span class="santa-hint" id="santa-hint">Toca a Santa</span>
    </div>
  </main>

  <!-- Tarjeta con la actividad del día (aparece tras la explosión de Santa) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <div class="santa" id="modal-santa" aria-hidden="true"></div>
      <p class="modal-eyebrow" id="modal-eyebrow"></p>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-text" id="modal-text"></p>
      <button class="modal-close" type="button" data-close>¡Listo!</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/activities.js"></script>
  <script src="js/snow.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/santas.js"></script>
  <script src="js/santa.js"></script>
  <script src="js/lights.js"></script>
  <script src="js/decorations.js"></script>
  <script src="js/reindeer.js"></script>
</body>
</html>
